# JSON: highlighting from a Tree-sitter grammar compiled to WebAssembly. No
# code. See Flareite's docs/extensions.md#languages.
id = "flareite.json"
name = "JSON"
version = "0.1.0"
description = "JSON highlighting."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

[[languages]]
id = "json"
name = "JSON"
file_extensions = ["json", "jsonc"]
grammar = "grammars/tree-sitter-json.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
# Comments are only valid in JSONC, as in VS Code.
line_comment = "//"
block_comment = ["/*", "*/"]
